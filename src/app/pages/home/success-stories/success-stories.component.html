<section class="success-stories-section">
    <div class="container">
      <div class="section-header text-center mb-5">
        <h2 class="section-title">Success Stories</h2>
        <div class="underline"></div>
        <p class="section-subtitle">Read how our students transformed their lives with language skills</p>
      </div>
      
      <div class="testimonials-container">
        <div class="testimonial-card" *ngFor="let testimonial of testimonials; let i = index" 
             [class.active]="i === currentTestimonialIndex">
          <div class="testimonial-content">
            <div class="quote-icon">
              <i class="fas fa-quote-left"></i>
            </div>
            <p class="testimonial-quote">{{ testimonial.quote }}</p>
            <div class="language-learned">
              <span class="badge">{{ testimonial.language }}</span>
            </div>
          </div>
          <div class="testimonial-author">
            <div class="author-image">
              <img [src]="testimonial.image" [alt]="testimonial.name">
            </div>
            <div class="author-info">
              <h4 class="author-name">{{ testimonial.name }}</h4>
              <p class="author-role">{{ testimonial.role }}</p>
            </div>
          </div>
        </div>
      </div>
      
      <div class="testimonial-indicators">
        <button *ngFor="let testimonial of testimonials; let i = index" 
                [class.active]="i === currentTestimonialIndex"
                (click)="setCurrentTestimonial(i)" 
                aria-label="Select testimonial"></button>
      </div>
    </div>
  </section>
