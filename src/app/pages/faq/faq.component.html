<section class="faq-section">
  <div class="container">
    <div class="section-title text-center animate-on-scroll">
      <h2>Frequently Asked Questions</h2>
      <div class="underline"></div>
      <p class="page-subtitle mb-5">Everything you need to know about our language programs</p>
    </div>
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="accordion" id="faqAccordion">
          <div 
            class="accordion-item animate-on-scroll" 
            *ngFor="let faq of faqs; index as i"
          >
            <h2 class="accordion-header">
              <button
                class="accordion-button collapsed"
                type="button"
                data-bs-toggle="collapse"
                [attr.data-bs-target]="'#faq' + faq.id"
              >
                {{ faq.question }}
              </button>
            </h2>
            <div
              [id]="'faq' + faq.id"
              class="accordion-collapse collapse"
              data-bs-parent="#faqAccordion"
            >
              <div class="accordion-body" [innerHTML]="faq.answer"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
